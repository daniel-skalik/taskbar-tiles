# Pushing a tag such as v1.0.0 tests the tagged commit, builds the release zip (tools\package.ps1) and publishes it
# as a GitHub release with notes generated from the commits since the previous release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload the zip

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Test
        run: dotnet test -c Release --disable-build-servers

      - name: Package
        shell: pwsh
        run: ./tools/package.ps1 -Version '${{ github.ref_name }}'

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $name = "TaskbarTiles-$version-win-x64.zip"
          $zip = "artifacts/package/$name"
          # The app is not code-signed: publish the zip's SHA-256, as a file next to it and in the notes, so people can
          # check the download before running it.
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          $sums = "artifacts/package/$name.sha256"
          [System.IO.File]::WriteAllText($sums, "$hash  $name`n")
          $notes = @"
          **SHA-256** of ``$name``: ``$hash``

          Check your download in PowerShell: ``(Get-FileHash .\$name).Hash`` should print the same value (in capitals).
          "@
          gh release create '${{ github.ref_name }}' $zip $sums --title "Taskbar Tiles $version" --notes $notes --generate-notes
